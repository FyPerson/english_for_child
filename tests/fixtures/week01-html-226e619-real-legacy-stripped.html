设计假设（v2 · 发音小实验）：
- 主要使用者是 7 岁孩子与陪学家长，近距离在手机或平板上共同操作。
- 孩子默认只看「动作口令 → 马上试 → 成功标准」，不要求理解口腔剖面。
- 舌位、发音原理和常见错误收进家长折叠区；浏览器合成语音只读完整单词，不冒充音素示范。
- 沿用 v1 的色彩、字体、助记插画、课程数据和进度存储，不改变七天教学节奏。
- v2.1：六个音素内置真人示范音（Freesound「English Phonemes」音包，CC BY-NC 4.0，教学式孤立发音，已降噪裁剪），字母积木即点即听；
  Andika / Baloo 2 以子集内嵌，整页离线自洽，不再依赖在线字体。
- v2.2：移除 Oxford Owl / UFLI 外链校准入口——内置录音已覆盖校准需求；页面除页脚授权署名外不含外部跳转。
- v2.3：单词卡 / 听辨复用助记图与绘本图，其余词补同风格插画；操作图标仍为 SVG。
- v2.4：每天拼读与词卡同一份词表；缺图词补齐；首页入口进入本周图文词卡墙。
- v2.5：sap / tan / pip 退出练习清单，专作周检保留词（守住「一个都没练过」的迁移测试前提）；
  声音寻宝 phone→pillow（ph 发 /f/）；第六天开读前加大写字母提示；小书新增打印视图（封面+六页+签名页）；
  第七天新增「听音摆积木」反向游戏；听辨同图词对不再显示插图；第三天拼读加入 in；音素音频出处注释与页脚对齐。
- v2.6：词卡墙轮廓规范——深色描边、长边约 8px 留白、去掉米色外光；构图离群词（an/at/pin/pan/sap/tan）重绘；Nat 上墙用 WALL_ILL 裁切版，绘本页仍用 BOOK_IMG。
- v2.6b：词卡墙 at / in / an 先读单词再读词组；tip 只读单词；课内拼读卡仍只读单词。

/* ================= tokens ================= */
:root{
  --ground:#D3F8E6; --surface:#FFFFFF; --surface-2:#E6FAF0; --sunk:#CAEBDB;
  --ink:#1B2A23; --ink-2:#51665C; --ink-3:#7C8E85;
  --line:#BFDFD0; --line-2:#A1C5B4;
  --vowel:#D8492F; --vowel-soft:#FBE7E2; --vowel-line:#F0BEB2;
  --cons:#1C6675; --cons-soft:#E0EEF1; --cons-line:#A9CFD7;
  --accent:#DE9420; --accent-soft:#FBF0DA; --accent-line:#EFCE92;
  --ok:#48874E; --ok-soft:#E4EFE4; --ok-line:#AACBAC;
  --shadow-1:0 1px 2px rgba(35,43,40,.07);
  --shadow-2:0 2px 4px rgba(35,43,40,.06), 0 10px 28px -14px rgba(35,43,40,.28);
  --shadow-3:0 4px 8px rgba(35,43,40,.08), 0 20px 44px -18px rgba(35,43,40,.34);
  --tile-face:#FFFFFF; --tile-edge:#AACABB;
  --r-s:8px; --r-m:14px; --r-l:22px; --r-xl:30px;
  --en:"Andika","Segoe UI",system-ui,sans-serif;
  --dis:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
  --zh:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#13211B; --surface:#1E2D26; --surface-2:#273730; --sunk:#0C1712;
    --ink:#E8F1EC; --ink-2:#A6B5AE; --ink-3:#7C8A83;
    --line:#34483F; --line-2:#465F53;
    --vowel:#F0785E; --vowel-soft:#3A211B; --vowel-line:#6B392E;
    --cons:#5FB7C8; --cons-soft:#12313A; --cons-line:#2A5C68;
    --accent:#EDB055; --accent-soft:#372A13; --accent-line:#6A5124;
    --ok:#72B978; --ok-soft:#1B2D1D; --ok-line:#3A5C3D;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
    --shadow-3:0 4px 8px rgba(0,0,0,.35), 0 20px 44px -18px rgba(0,0,0,.8);
    --tile-face:#273730; --tile-edge:#4C6459;
  }
}
:root[data-theme="dark"]{
  --ground:#13211B; --surface:#1E2D26; --surface-2:#273730; --sunk:#0C1712;
  --ink:#E8F1EC; --ink-2:#A6B5AE; --ink-3:#7C8A83;
  --line:#34483F; --line-2:#465F53;
  --vowel:#F0785E; --vowel-soft:#3A211B; --vowel-line:#6B392E;
  --cons:#5FB7C8; --cons-soft:#12313A; --cons-line:#2A5C68;
  --accent:#EDB055; --accent-soft:#372A13; --accent-line:#6A5124;
  --ok:#72B978; --ok-soft:#1B2D1D; --ok-line:#3A5C3D;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-3:0 4px 8px rgba(0,0,0,.35), 0 20px 44px -18px rgba(0,0,0,.8);
  --tile-face:#273730; --tile-edge:#4C6459;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--zh); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--dis); font-weight:700; line-height:1.25; text-wrap:balance; margin:0}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none; text-align:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}}

.wrap{max-width:1080px; margin:0 auto; padding:0 20px}
.en{font-family:var(--en)}
.v{color:var(--vowel)}

/* ================= top bar ================= */
.topbar{
  position:sticky; top:0; z-index:50; background:var(--ground);
  border-bottom:1px solid var(--line);
}
.topbar__in{display:flex; align-items:center; gap:16px; min-height:60px}
.brand{display:flex; align-items:baseline; gap:9px; font-family:var(--dis); font-weight:800; font-size:18px; white-space:nowrap}
.brand__wk{font-size:12px; font-weight:600; color:var(--ink-3); letter-spacing:.08em; font-family:var(--zh); white-space:nowrap}
.dots{display:flex; gap:6px; margin-left:auto}
.dot{
  width:26px; height:26px; border-radius:50%; border:2px solid var(--line-2);
  font-family:var(--dis); font-size:12px; font-weight:700; color:var(--ink-3);
  display:grid; place-items:center; transition:all .2s;
}
.dot:hover{border-color:var(--cons); color:var(--cons)}
.dot--done{background:var(--ok); border-color:var(--ok); color:#fff}
.dot--now{border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.themebtn{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:var(--ink-2); border:1px solid var(--line)}
.themebtn:hover{background:var(--surface-2); color:var(--ink)}

/* ================= hero ================= */
.hero{padding:52px 0 30px}
.hero__eyebrow{
  font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--cons); margin-bottom:14px;
}
.hero h1{font-size:clamp(34px,5.4vw,52px); letter-spacing:-.01em; margin-bottom:16px}
.hero__lede{font-size:17px; color:var(--ink-2); max-width:56ch; line-height:1.75}
.tiles-demo{display:flex; gap:9px; align-items:center; margin-top:30px; flex-wrap:wrap}

/* ================= letter tile ================= */
.tile{
  width:64px; height:72px; border-radius:var(--r-m);
  background:var(--tile-face); border:2px solid var(--tile-edge); border-bottom-width:5px;
  font-family:var(--en); font-size:38px; font-weight:700; line-height:1;
  display:grid; place-items:center; color:var(--ink);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s;
  user-select:none; flex:none;
}
.tile--v{color:var(--vowel); border-color:var(--vowel-line); background:var(--vowel-soft)}
.tile--c{color:var(--cons); border-color:var(--cons-line); background:var(--cons-soft)}
.tile--sm{width:42px; height:48px; font-size:25px; border-bottom-width:4px; border-radius:10px}
.tile--lg{width:92px; height:104px; font-size:58px; border-bottom-width:7px; border-radius:20px}
button.tile:hover{transform:translateY(-3px); box-shadow:var(--shadow-2)}
button.tile:active{transform:translateY(1px)}
.tile--lit{animation:pop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.16) translateY(-6px)}100%{transform:scale(1)}}
/* 积木点亮墙（v3 新增）：点亮=正常 v/c 配色 + 微光；未点亮=灰暗态，覆盖 v/c 配色 */
.tile--wallon{box-shadow:0 0 0 3px var(--ok-soft), 0 0 14px -2px var(--ok)}
.tile--walloff{color:var(--ink-3) !important; border-color:var(--line-2) !important; background:var(--sunk) !important}

/* ================= generic ================= */
.section-h{display:flex; align-items:center; gap:12px; margin:44px 0 18px}
.section-h h2{font-size:23px}
.section-h__rule{flex:1; height:1px; background:var(--line)}
.pill{
  font-family:var(--zh); font-size:12px; font-weight:700; padding:4px 11px; border-radius:99px;
  border:1px solid var(--line-2); color:var(--ink-2); background:var(--surface); white-space:nowrap;
}
.pill--ok{color:var(--ok); border-color:var(--ok-line); background:var(--ok-soft)}
.pill--v{color:var(--vowel); border-color:var(--vowel-line); background:var(--vowel-soft)}
.pill--c{color:var(--cons); border-color:var(--cons-line); background:var(--cons-soft)}
.pill--a{color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft)}

/* ================= day grid ================= */
.daygrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:14px}
.daycard{
  padding:20px; border-radius:var(--r-l); background:var(--surface);
  border:1px solid var(--line); box-shadow:var(--shadow-1);
  display:flex; flex-direction:column; gap:11px; min-height:176px;
  transition:transform .18s, box-shadow .18s, border-color .18s;
}
.daycard:hover{transform:translateY(-4px); box-shadow:var(--shadow-3); border-color:var(--cons-line)}
.daycard__top{display:flex; align-items:center; justify-content:space-between; gap:8px}
.daycard__n{font-family:var(--dis); font-size:12px; font-weight:700; letter-spacing:.1em; color:var(--ink-3)}
.daycard__t{font-family:var(--dis); font-size:19px; font-weight:700; line-height:1.3}
.daycard__g{font-size:13.5px; color:var(--ink-2); line-height:1.6; flex:1}
.daycard__sounds{display:flex; gap:6px; flex-wrap:wrap}
.daycard--done{border-color:var(--ok-line)}
.daycard--rest{border-style:dashed; background:var(--surface-2)}
.daycard--today{border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft)}
.check{width:22px; height:22px; border-radius:50%; background:var(--ok); display:grid; place-items:center; flex:none; color:#fff}

/* ================= notes ================= */
.pnote{
  border:1px solid var(--accent-line); background:var(--accent-soft);
  border-radius:var(--r-m); padding:16px 18px; display:flex; gap:13px; align-items:flex-start;
}
.pnote__ico{flex:none; margin-top:2px; color:var(--accent)}
.pnote__b{font-size:14.5px; line-height:1.72}
.pnote--warn{border-color:var(--vowel-line); background:var(--vowel-soft)}
.pnote--warn .pnote__ico{color:var(--vowel)}
.pnote--ok{border-color:var(--ok-line); background:var(--ok-soft)}
.pnote--ok .pnote__ico{color:var(--ok)}

details.fold{border:1px solid var(--line); border-radius:var(--r-m); background:var(--surface); overflow:hidden}
details.fold>summary{
  padding:15px 18px; cursor:pointer; font-weight:700; font-size:15px; list-style:none;
  display:flex; align-items:center; gap:10px; font-family:var(--dis);
}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:""; width:8px; height:8px; margin-left:auto; border-right:2px solid var(--ink-3); border-bottom:2px solid var(--ink-3); transform:rotate(45deg) translateY(-2px); transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(225deg) translateY(-2px)}
details.fold>summary:hover{background:var(--surface-2)}
.fold__body{padding:16px 18px 18px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:14px}

/* ================= day view ================= */
.dayhead{padding:32px 0 8px}
.backlink{display:inline-flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--ink-2); margin-bottom:18px}
.backlink:hover{color:var(--cons)}
.dayhead h1{font-size:clamp(28px,4.4vw,40px); margin:10px 0 14px}
.goalbar{
  display:flex; align-items:center; gap:13px; padding:15px 18px; border-radius:var(--r-m);
  border:1px solid var(--ok-line); background:var(--ok-soft); margin-top:6px;
}
.goalbar__l{font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--ok); flex:none}
.goalbar__t{font-size:15.5px; font-weight:500; line-height:1.6}

/* ================= steps ================= */
.steps{display:flex; flex-direction:column; gap:12px; margin-top:26px}
.step{border:1px solid var(--line); border-radius:var(--r-l); background:var(--surface); overflow:hidden; box-shadow:var(--shadow-1)}
.step--open{border-color:var(--cons-line); box-shadow:var(--shadow-2)}
.step--done .step__num{background:var(--ok); border-color:var(--ok); color:#fff}
.step__hd{width:100%; display:flex; align-items:center; gap:14px; padding:17px 20px}
.step__hd:hover{background:var(--surface-2)}
.step__num{
  width:32px; height:32px; border-radius:50%; border:2px solid var(--line-2); flex:none;
  font-family:var(--dis); font-weight:700; font-size:15px; display:grid; place-items:center; color:var(--ink-3);
  transition:all .2s;
}
.step__ttl{font-family:var(--dis); font-weight:700; font-size:17px; flex:1}
.step__min{font-family:var(--dis); font-weight:700; font-size:13px; color:var(--ink-3); flex:none; font-variant-numeric:tabular-nums}
.step__body{padding:20px; display:flex; flex-direction:column; gap:18px; border-top:1px solid var(--line)}
.step__body[hidden]{display:none}

.lead{font-size:15.5px; line-height:1.75; color:var(--ink-2)}
.lead strong{color:var(--ink); font-weight:700}
.say{font-family:var(--en); font-weight:700; color:var(--ink)}

/* ================= sound lab ================= */
.sound{border:1px solid var(--line); border-radius:var(--r-l); overflow:hidden; background:var(--surface)}
.sound__hd{display:flex; align-items:center; gap:18px; padding:20px; background:var(--surface); border-bottom:1px solid var(--line)}
.sound__meta{flex:1; min-width:0}
.sound__ipa{font-family:var(--en); font-size:26px; font-weight:700; line-height:1.2}
.sound__ipa.is-v{color:var(--vowel)}
.sound__ipa.is-c{color:var(--cons)}
.sound__hint{font-size:13.5px; color:var(--ink-2); margin-top:3px}
.sound__body{padding:20px; display:flex; flex-direction:column; gap:18px}
.soundlab{display:grid; grid-template-columns:150px minmax(0,1fr); gap:22px; align-items:stretch}
.soundlab__visual{
  border-right:1px solid var(--line); padding:4px 22px 4px 2px;
  display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
}
.mnemonic-img{width:112px; height:112px; object-fit:contain; display:block}
.soundlab__memory{font-size:13px; line-height:1.55; color:var(--ink-2); margin-top:8px}
.soundlab__practice{display:flex; flex-direction:column; gap:14px; justify-content:center}
.lablabel{
  display:inline-flex; align-items:center; align-self:flex-start; gap:7px;
  font-family:var(--dis); font-size:12px; font-weight:800; letter-spacing:.08em; color:var(--cons);
}
.lablabel__n{
  width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
  background:var(--cons); color:#fff; font-size:12px; letter-spacing:0;
}
.soundlab__listen{align-self:flex-start; display:inline-flex; align-items:center; gap:8px; padding:8px 16px; font-size:14px}
.soundlab__cue{font-family:var(--dis); font-size:clamp(20px,3.6vw,27px); font-weight:700; line-height:1.5; text-wrap:balance}
.experiment{
  display:grid; grid-template-columns:minmax(118px,.55fr) minmax(0,1fr); gap:16px;
  border-top:1px solid var(--line); padding-top:16px;
}
.experiment__title{font-family:var(--dis); font-size:17px; font-weight:700; color:var(--accent); line-height:1.4}
.experiment__body{font-size:14.5px; line-height:1.72; color:var(--ink-2)}
.experiment__pass{margin-top:7px; color:var(--ok); font-weight:700}
.parent-coach{background:var(--surface-2) !important}
.parent-coach>summary{color:var(--ink-2)}
.parent-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.parent-item{font-size:14px; line-height:1.72; color:var(--ink-2)}
.parent-item b{display:block; color:var(--ink); margin-bottom:3px}
.sound__examples{border-top:1px solid var(--line); padding-top:16px}

.wordrow{display:flex; gap:10px; flex-wrap:wrap}
.wordchip{
  display:flex; align-items:center; gap:9px; padding:8px 15px 8px 9px; border-radius:99px;
  border:1px solid var(--line-2); background:var(--surface); transition:all .16s;
}
.wordchip:hover{border-color:var(--cons); background:var(--cons-soft); transform:translateY(-2px)}
.wordchip__w{font-family:var(--en); font-size:18px; font-weight:700}
.wordchip__zh{font-size:12.5px; color:var(--ink-3)}
.spk{width:26px; height:26px; border-radius:50%; background:var(--cons-soft); color:var(--cons); display:grid; place-items:center; flex:none}
.wordchip:hover .spk{background:var(--cons); color:#fff}

/* ================= blender ================= */
.blender{
  border:1px solid var(--cons-line); border-radius:var(--r-l); background:var(--cons-soft);
  padding:26px 20px; display:flex; flex-direction:column; align-items:center; gap:20px;
}
.blender__stage{display:flex; align-items:center; justify-content:center; gap:10px; min-height:112px; flex-wrap:wrap}
.blender__stage.is-merged{gap:2px}
.blender__ctl{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.btn{
  padding:11px 22px; border-radius:99px; font-family:var(--dis); font-weight:700; font-size:15px;
  background:var(--cons); color:#fff; box-shadow:var(--shadow-1); transition:all .16s;
  display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{transform:translateY(-2px); box-shadow:var(--shadow-2); filter:brightness(1.09)}
.btn:active{transform:translateY(0)}
.btn--ghost{background:var(--surface); color:var(--ink-2); border:1px solid var(--line-2); box-shadow:none}
.btn--ghost:hover{color:var(--cons); border-color:var(--cons); filter:none}
.btn--ok{background:var(--ok)}
.btn--lg{padding:15px 32px; font-size:17px}
.blender__mean{font-size:15px; color:var(--ink-2); min-height:26px; text-align:center}
.blender__mean b{color:var(--ink)}

/* ================= word cards ================= */
.wcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(134px,1fr)); gap:12px}
.wcard{
  border:1px solid var(--line); border-radius:var(--r-m); background:var(--surface);
  padding:14px 10px 13px; display:flex; flex-direction:column; align-items:center; gap:9px;
  transition:all .18s; text-align:center;
}
.wcard:hover{transform:translateY(-4px); box-shadow:var(--shadow-2); border-color:var(--cons-line)}
.wcard__art{width:72px; height:72px; display:grid; place-items:center}
.wcard__art img{width:72px;height:72px;object-fit:contain;display:block}
.pairbtn img{width:56px;height:56px;object-fit:contain;display:block}
.wcards--wall{grid-template-columns:repeat(6, minmax(0,1fr)); gap:12px}
.wcard--wall{padding:16px 8px 14px; min-width:0}
.wcard--trophy-off{filter:grayscale(1); opacity:.42; transition:opacity .16s}
.wcard--trophy-off:hover{opacity:.65}
.wcard__art--lg{width:100%; max-width:112px; aspect-ratio:1; height:auto; overflow:hidden}
.wcard__art--lg img{width:100% !important; height:100% !important; max-width:none; object-fit:contain; display:block}
.wall-hint{display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1.35}
.wall-hint__en{font-family:var(--en); font-size:11.5px; font-weight:700; color:var(--ink-2); white-space:nowrap}
.wall-hint__zh{font-size:11.5px; color:var(--ink-3); white-space:nowrap}
.wall-entry{
  width:100%; margin-top:16px; padding:20px 22px;
  border:1px solid var(--cons-line); border-radius:var(--r-l);
  background:var(--cons-soft); display:flex; align-items:center; gap:16px;
  text-align:left; box-shadow:var(--shadow-1); transition:transform .18s, box-shadow .18s;
}
.wall-entry:hover{transform:translateY(-3px); box-shadow:var(--shadow-3)}
.wall-entry__k{font-size:12px; font-weight:700; letter-spacing:.1em; color:var(--cons)}
.wall-entry__t{font-family:var(--dis); font-size:22px; font-weight:700; margin:4px 0 2px}
.wall-entry__g{font-size:14px; color:var(--ink-2); line-height:1.55}
.wcard__w{font-family:var(--en); font-size:23px; font-weight:700}
.wcard__zh{font-size:12.5px; color:var(--ink-3); line-height:1.45}

/* ================= minimal pair ================= */
.pair{display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:440px; margin:0 auto; width:100%}
.pairbtn{
  border:2px solid var(--line-2); border-radius:var(--r-l); background:var(--surface); padding:20px 12px;
  display:flex; flex-direction:column; align-items:center; gap:10px; transition:all .16s;
}
.pairbtn:hover{border-color:var(--cons); transform:translateY(-3px)}
.pairbtn__w{font-family:var(--en); font-size:32px; font-weight:700}
.pairbtn--right{border-color:var(--ok); background:var(--ok-soft); animation:pop .42s}
.pairbtn--wrong{border-color:var(--vowel); background:var(--vowel-soft); animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.quizbar{display:flex; align-items:center; gap:14px; justify-content:center; flex-wrap:wrap}
.quizbar__msg{font-size:15px; font-weight:600; min-height:26px; text-align:center}

/* ================= book ================= */
.book{border:1px solid var(--line-2); border-radius:var(--r-xl); background:var(--surface); overflow:hidden; box-shadow:var(--shadow-2)}
.book__page{padding:30px 24px; display:flex; flex-direction:column; align-items:center; gap:22px; min-height:330px; justify-content:center}
.book__art{width:min(220px,58vw); height:min(220px,58vw)}
.book__line{font-family:var(--en); font-size:clamp(27px,5.4vw,38px); font-weight:700; text-align:center; line-height:1.4}
.book__nav{display:flex; align-items:center; flex-wrap:wrap; gap:14px; padding:14px 18px; border-top:1px solid var(--line); background:var(--surface-2)}
.book__pg{font-family:var(--dis); font-weight:700; font-size:14px; color:var(--ink-3); font-variant-numeric:tabular-nums; margin:0 auto}
.iconbtn{width:42px; height:42px; border-radius:50%; border:1px solid var(--line-2); display:grid; place-items:center; color:var(--ink-2); background:var(--surface); flex:none}
.iconbtn:hover:not(:disabled){border-color:var(--cons); color:var(--cons)}
.iconbtn:disabled{opacity:.32; cursor:default}

/* ================= flash ================= */
.flash{display:flex; flex-direction:column; align-items:center; gap:18px; padding:26px 16px; border:1px solid var(--line); border-radius:var(--r-l); background:var(--surface-2)}
.flash__face{font-family:var(--en); font-size:clamp(50px,12vw,82px); font-weight:700; line-height:1; min-height:94px; display:grid; place-items:center}
.flash__meta{font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.flash__metarow{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap}
.flash__record{font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.flash__record--new{color:var(--ok); font-weight:700}

/* ================= checklist ================= */
.checks{display:flex; flex-direction:column; gap:10px}
.checkitem{
  display:flex; align-items:flex-start; gap:13px; padding:14px 16px; border-radius:var(--r-m);
  border:1px solid var(--line); background:var(--surface); transition:all .16s; width:100%;
}
.checkitem:hover{border-color:var(--ok-line); background:var(--ok-soft)}
.checkitem--on{border-color:var(--ok); background:var(--ok-soft)}
.checkbox{
  width:24px; height:24px; border-radius:7px; border:2px solid var(--line-2); flex:none; margin-top:2px;
  display:grid; place-items:center; transition:all .16s; color:transparent;
}
.checkitem--on .checkbox{background:var(--ok); border-color:var(--ok); color:#fff}
.checkitem__t{font-size:15px; line-height:1.6}
.checkitem__t small{display:block; color:var(--ink-3); font-size:12.5px; margin-top:2px; line-height:1.55}

.finish{
  margin:28px 0 20px; padding:28px 24px; border-radius:var(--r-xl); text-align:center;
  border:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; align-items:center; gap:15px;
}
.finish--on{border-color:var(--ok); background:var(--ok-soft)}
.finish h3{font-size:21px}
.finish p{font-size:14.5px; color:var(--ink-2); max-width:46ch}

/* ================= table ================= */
.tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-m)}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:430px}
th,td{padding:11px 14px; text-align:left; border-bottom:1px solid var(--line)}
th{background:var(--surface-2); font-weight:700; font-size:13px; color:var(--ink-2)}
tr:last-child td{border-bottom:none}
td .en{font-size:17px; font-weight:700}

.foot{padding:32px 0 60px; border-top:1px solid var(--line); margin-top:44px; color:var(--ink-3); font-size:13.5px; line-height:1.8}
.foot strong{color:var(--ink-2)}
.foot__credits{font-size:12px; margin-top:14px}
.foot__credits a{color:var(--ink-3); text-decoration:underline}
.foot__credits a:hover{color:var(--cons)}

@media(max-width:640px){
  .wrap{padding:0 15px}
  .hero{padding:34px 0 24px}
  .soundlab{grid-template-columns:1fr; gap:16px}
  .soundlab__visual{border-right:none; border-bottom:1px solid var(--line); padding:0 0 16px; flex-direction:row; text-align:left; gap:14px}
  .mnemonic-img{width:88px; height:88px}
  .wcards--wall{grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
  .wcard--wall{padding:12px 8px 10px}
  .wcard--wall .wcard__w{font-size:18px}
  .soundlab__memory{margin-top:0; max-width:16ch}
  .experiment{grid-template-columns:1fr; gap:6px}
  .parent-grid{grid-template-columns:1fr; gap:13px}
  .step__hd{padding:15px}
  .step__body{padding:16px 15px}
  /* 顶栏改两行：进度点独占一行平分宽度，保证触控尺寸；

<script>
/* ==================================================================
   ART — 操作图标仍用内联 SVG（currentColor，跟随主题）。
   音素助记、绘本、单词卡 / 听辨使用内嵌位图：同一物体只保留一套画法。
   ================================================================== */
const C = {
  orange:'#F0A63A', coral:'#E8735A', teal:'#4BA3A8', green:'#7FB069',
  sand:'#F0D2A0', steel:'#93A9BA', brown:'#B4855C', cream:'#F7E6C8',
  pink:'#EFA9A0', sky:'#8FC4D9', grey:'#B9C2BE'
};
/* SOURCE: media/week01/phoneme_ill.js */
const PHONEME_ILL = {
  ant:'data:image/x;base64,AA==',
  igloo:'data:image/x;base64,AA==',
  nose:'data:image/x;base64,AA==',
  popcorn:'data:image/x;base64,AA==',
  snake:'data:image/x;base64,AA==',
  tiger:'data:image/x;base64,AA==',
};

/* END SOURCE: media/week01/phoneme_ill.js */
const S = (inner, vb) => `<svg viewBox="${vb||'0 0 100 100'}" fill="none" stroke="currentColor" stroke-width="3.2"
  stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%" aria-hidden="true">${inner}</svg>`;

/* ---------- Nat 这只小狗，全书复用 ----------
   正面用于「坐 / 被拍 / 被叫」，侧面用于「站 / 趴睡」。
   耳朵先画在头后面，鼻口在头前面，顺序不能乱。 */
const natFaceFront = (cy, r) => {
  const e = r * 0.42, eh = r * 0.74;
  return `
    <ellipse cx="${50-r*1.02}" cy="${cy+r*0.16}" rx="${e}" ry="${eh}" fill="${C.brown}" transform="rotate(-15 ${50-r*1.02} ${cy+r*0.16})"/>
    <ellipse cx="${50+r*1.02}" cy="${cy+r*0.16}" rx="${e}" ry="${eh}" fill="${C.brown}" transform="rotate(15 ${50+r*1.02} ${cy+r*0.16})"/>
    <circle cx="50" cy="${cy}" r="${r}" fill="${C.sand}"/>
    <circle cx="${50-r*0.4}" cy="${cy-r*0.2}" r="${r*0.145}" fill="currentColor" stroke="none"/>
    <circle cx="${50+r*0.4}" cy="${cy-r*0.2}" r="${r*0.145}" fill="currentColor" stroke="none"/>
    <ellipse cx="50" cy="${cy+r*0.32}" rx="${r*0.29}" ry="${r*0.22}" fill="${C.brown}"/>
    <path d="M50 ${cy+r*0.54}v${r*0.15}"/>
    <path d="M50 ${cy+r*0.69}q${-r*0.19} ${r*0.19} ${-r*0.35} 0"/>
    <path d="M50 ${cy+r*0.69}q${r*0.19} ${r*0.19} ${r*0.35} 0"/>`;
};
const natSideHead = (hx, hy, r, shut) => `
    <ellipse cx="${hx-r*0.5}" cy="${hy-r*0.5}" rx="${r*0.46}" ry="${r*0.8}" fill="${C.brown}" transform="rotate(-26 ${hx-r*0.5} ${hy-r*0.5})"/>
    <circle cx="${hx}" cy="${hy}" r="${r}" fill="${C.sand}"/>
    <ellipse cx="${hx-r*0.92}" cy="${hy+r*0.46}" rx="${r*0.62}" ry="${r*0.44}" fill="${C.sand}"/>
    <ellipse cx="${hx-r*1.42}" cy="${hy+r*0.34}" rx="${r*0.27}" ry="${r*0.23}" fill="${C.brown}"/>
    ${shut
      ? `<path d="M${hx-r*0.36} ${hy-r*0.14}q${r*0.28} ${r*0.24} ${r*0.56} 0"/>`
      : `<circle cx="${hx-r*0.14}" cy="${hy-r*0.18}" r="${r*0.17}" fill="currentColor" stroke="none"/>`}`;

function nat(pose){
  if(pose === 'stand') return S(`
    <path d="M42 64v20M53 66v18M65 66v18M75 64v20" stroke="${C.sand}" stroke-width="9"/>
    <path d="M42 64v20M53 66v18M65 66v18M75 64v20" stroke-width="2.4"/>
    <ellipse cx="58" cy="56" rx="23" ry="14" fill="${C.sand}"/>
    <path d="M79 48q12-4 10-16" stroke-width="4.6"/>
    ${natSideHead(28, 42, 15, false)}`);

  if(pose === 'sit') return S(`
    <path d="M31 88q1-30 19-30t19 30z" fill="${C.sand}"/>
    <path d="M31 88q1-30 19-30t19 30z"/>
    <path d="M70 76q13-3 12-15" stroke-width="4.6"/>
    <ellipse cx="38" cy="86" rx="7" ry="4.6" fill="${C.sand}"/>
    <ellipse cx="62" cy="86" rx="7" ry="4.6" fill="${C.sand}"/>
    ${natFaceFront(38, 20)}`);

  if(pose === 'nap') return S(`
    <ellipse cx="56" cy="72" rx="27" ry="13" fill="${C.sand}"/>
    <path d="M81 68q11-4 10-14" stroke-width="4.4"/>
    ${natSideHead(29, 64, 15, true)}
    <text x="60" y="40" font-size="16" font-weight="800" fill="currentColor" stroke="none" font-family="Baloo 2,sans-serif">z</text>
    <text x="74" y="27" font-size="11" font-weight="800" fill="currentColor" stroke="none" font-family="Baloo 2,sans-serif">z</text>`);

  if(pose === 'dream') return S(`
    <ellipse cx="52" cy="79" rx="26" ry="12" fill="${C.sand}"/>
    <path d="M76 76q11-4 10-13" stroke-width="4.2"/>
    ${natSideHead(27, 72, 13.5, true)}
    <circle cx="47" cy="52" r="3.6" fill="${C.cream}"/>
    <circle cx="56" cy="43" r="5.4" fill="${C.cream}"/>
    <ellipse cx="72" cy="26" rx="19" ry="15" fill="${C.cream}"/>
    <ellipse cx="72" cy="26" rx="19" ry="15"/>
    <path d="M64 22v5M80 22v5" stroke-width="3"/>
    <path d="M65 31q7 6 14 0" stroke-width="2.6"/>`);

  if(pose === 'cheer') return S(`
    <ellipse cx="50" cy="62" rx="22" ry="14" fill="${C.sand}"/>
    <path d="M32 60q-14-6-14-20M68 60q14-6 14-20" stroke="${C.sand}" stroke-width="8"/>
    <path d="M32 60q-14-6-14-20M68 60q14-6 14-20" stroke-width="2.4"/>
    <path d="M40 74v14M60 74v14" stroke="${C.sand}" stroke-width="9"/>
    <path d="M40 74v14M60 74v14" stroke-width="2.4"/>
    ${natFaceFront(38, 20)}`);

  return '';
}

/* ---------- AudioBus：唯一仲裁入口。stopAll 合法调用方只有两类（三审 S-1 收窄）——

const AudioBus = (() => {
  let stopCurrent = null; // 当前 WordAudio 请求注册的"被外部取消"回调

  return {
    generation(){ return gen; },
    stopAll(){
      gen++;
      if(stopCurrent){ const fn = stopCurrent; stopCurrent = null; try{ fn(); }catch(e){} }
      try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
      try{ Phone.stopAll(); }catch(e){}
      /* §2.3：切页或任何新逻辑请求都要使未消费的失败 continuation 失效、提示条消失 */

    /* 音素键专用（预筛M4 裁定）：取消单词请求与 TTS，但不掐音素自身——

       "挤在一起"教学效果正建立在音素间叠音上。单词↔音素互断语义保留。 */
    stopForPhone(){
      gen++;
      if(stopCurrent){ const fn = stopCurrent; stopCurrent = null; try{ fn(); }catch(e){} }
      try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
      hideAudioFailure();
    },
    _registerStopper(fn){ stopCurrent = fn; },
    _clearStopper(fn){ if(stopCurrent === fn) stopCurrent = null; }

/* ---------- 系统 TTS 语音选择：voiceschanged 是异步事件，页面刚打开时
   getVoices() 可能仍是空数组，需监听更新，供 speakFallback 使用 ---------- */
let ttsVoice = null;
function refreshTtsVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices() || [];
  const en = voices.filter(v => /^en(-|_)/i.test(v.lang || ''));
  ttsVoice = en.find(v => /natural|premium|enhanced|aria|jenny|guy|zira|david|mark/i.test(v.name)) ||
             en.find(v => /^en(-|_)US/i.test(v.lang)) || en[0] || null;
}
if('speechSynthesis' in window){
  refreshTtsVoice();
  speechSynthesis.addEventListener('voiceschanged', refreshTtsVoice);
}

/* ---------- speakFallback：≤10 行极简封装。不保留 v2 的 kick/setTimeout
   时序 hack 与 sayParts；由调用方（WordAudio.play 内部）负责阶段判定。 ---------- */
function speakFallback(text, rate, onend, onerror){
  if(!('speechSynthesis' in window)){ onerror && onerror(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = (ttsVoice && ttsVoice.lang) || 'en-US';
  if(ttsVoice) u.voice = ttsVoice;
  u.rate = rate || 0.75; u.pitch = 1.05;   // 预筛M6：对齐 mp3 -20% 的教学语速基线
  if(onend) u.addEventListener('end', onend);
  if(onerror) u.addEventListener('error', onerror);
  try{ speechSynthesis.resume(); }catch(e){}   // v2 同款：引擎 paused 态会让 utterance 静默排队（codex S1 审 #2）
  try{ speechSynthesis.speak(u); }catch(e){ onerror && onerror(); }
}

/* ---------- WordAudio：唯一单词/句子播放入口。返回 Promise，永不 reject。
   请求生命周期（规格 §2.1 调用序冻结）：
   ① 取消当前 ownerToken + 停止全部物理音源
   ② 分配本次 ownerToken
   ③ 播内嵌 mp3；完整播完 → resolve ended
   ④ ③ 失败且检测到英文语音 → 沿用同一 ownerToken 转 TTS 兜底（阶段级失效 T-1：
      转入前暂停归零旧 Audio、失效其监听器、清除该阶段超时器；phase 枚举
      embedded/fallback，所有回调同时校验 ownerToken + 当前 phase）
   ⑤ 全程任一时刻被外部取消 → resolve cancelled 并停止物理音源 ---------- */
const WordAudio = (() => {
  let seq = 0;
  let player = null; // Reuse the gesture-authorized element for delayed word/phrase playback.
  function play(key, opts){
    opts = opts || {};
    return new Promise(resolve => {
      AudioBus.stopAll();                 // ①
      const token = ++seq;                 // ②
      let phase = 'embedded';
      let audioEl = null, timeoutId = null, settled = false;
      const isCurrent = () => token === seq;

      function stopper(){ finish('cancelled'); } // ⑤ 外部取消入口
      AudioBus._registerStopper(stopper);

      function stopPhysical(){
        if(audioEl){
          try{ audioEl.pause(); audioEl.currentTime = 0; }catch(e){}
          audioEl.onended = null; audioEl.onerror = null; audioEl = null;
        }
        try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
        if(timeoutId){ clearTimeout(timeoutId); timeoutId = null; }
      }
      function finish(status){
        if(settled) return;
        settled = true;
        seq++;   // 预筛H1：终结即在 token 层作废本请求，防迟到回调复活
        stopPhysical();
        AudioBus._clearStopper(stopper);
        resolve({status});
      }

      if(typeof key !== 'string' || !key){   // 预筛M5：空键=程序错误，静默不误导家长
        console.warn('[WordAudio] empty key');
        finish('cancelled');
        return;
      }

      if(Guard.isReserved(key)){
        console.warn('[AudioBus] blocked reserved key:', key);
        finish('blocked');
        return;
      }

      function toFallback(){                // ④
        if(settled || !isCurrent()) return; // 预筛H1：已取消/已终结的请求不得复活成 TTS
        stopPhysical();                     // 阶段级失效：先停旧音源、清旧超时器
        refreshTtsVoice();                  // 预筛M3：voiceschanged 异步，进兜底前现拉一次
        if(!ttsVoice || window.__disableTtsFallback){ finish('failed'); return; }
        phase = 'fallback';
        timeoutId = setTimeout(() => { if(isCurrent() && phase === 'fallback') finish('failed'); }, 8000);
        /* Chrome/Edge：cancel() 后立刻 speak() 常被静默丢掉，错开一个短拍（v2 同款 workaround，预筛H2）。
           opts.rate 是相对倍率（playbackRate 语义），TTS 侧换算为 0.75 基准 × 倍率——
           否则慢速倍率可能会比常速 0.75 更快，造成兜底路径的快慢关系反转（末次审 #1） */
        setTimeout(() => {
          if(settled || !isCurrent() || phase !== 'fallback') return;
          speakFallback(key, 0.75 * (opts.rate || 1),
            () => { if(isCurrent() && phase === 'fallback') finish('ended'); },
            () => { if(isCurrent() && phase === 'fallback') finish('failed'); });
        }, 60);
      }

      const src = WORD_AUDIO[key];
      if(!src){ toFallback(); return; }     // 缺键直接转兜底

      audioEl = player || (player = new Audio()); // ③ Keep Safari playback permission on this element.
      audioEl.src = src;
      audioEl.playbackRate = opts.rate || 1;
      audioEl.onended = () => { if(isCurrent() && phase === 'embedded') finish('ended'); };
      audioEl.onerror = () => { if(isCurrent() && phase === 'embedded') toFallback(); };
      timeoutId = setTimeout(() => { if(isCurrent() && phase === 'embedded') toFallback(); }, 8000);
      try{
        const p = audioEl.play();
        if(p && p.catch) p.catch(error => {
          if(!isCurrent() || phase !== 'embedded') return;
          // A blocked gesture needs a fresh tap, not a delayed TTS attempt.
          if(error && error.name === 'NotAllowedError') finish('failed');
          else toFallback();
        });
      }catch(e){ toFallback(); }
    });
  }
  return { play };
})();

/* ---------- runAudioStage：统一阶段处理（规格 §2.3）。ended→onEnded 推进；
   failed→出提示条，retry 重新调用本函数（可重新武装、可无限重试，四审 T-2）；
   cancelled/blocked→静默，不推进不出 UI。 ---------- */
function runAudioStage(playFn, onEnded){
  playFn().then(r => {
    if(r.status === 'ended'){ if(onEnded) onEnded(); }
    else if(r.status === 'failed'){ showAudioFailure({ retry(){ runAudioStage(playFn, onEnded); } }); }
  });
}

/* 本周按本地自然日开放；完成记录与开放日期独立。 */
function isValidDateStr(s){
  if(typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y,m,d] = s.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  // 用回填法核对是不是真实日历日（比如 2026-02-30 会被 Date 自动进位成 3 月
  // 2 号，进位后年/月/日跟原始输入对不上就说明原始输入根本不是合法日期）。
  return dt.getFullYear() === y && dt.getMonth() === m-1 && dt.getDate() === d;
}
if(!isValidDateStr(state.startDate)) delete state.startDate;
if(!isValidDateStr(state.pausedOn))delete state.pausedOn;
if(!Number.isInteger(state.openThrough)||state.openThrough<1||state.openThrough>7)delete state.openThrough;
if(typeof state.startDatePromptDismissed !== 'boolean') state.startDatePromptDismissed = false;

function todayDayN(){
  if(!isValidDateStr(state.startDate)) return null;
  const [y,m,d] = state.startDate.split('-').map(Number);
  /* 审查 #1：本地年月日提取后用 Date.UTC 生成纯日历序号相减——不是把输入当 UTC 解析，
     而是把"日历日"映射到无 DST/无午夜长度变化的数轴上，彻底消除时区切换边界的 ±1 天 */
  const now = new Date();
  const n = Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(y, m-1, d)) / 86400000) + 1;
  return (n >= 1 && n <= 7) ? n : null;   // 未开课/超一周一律 null，调用方据此静默
}
function formatDateZh(s){
  const [, m, d] = s.split('-').map(Number);
  return `${m}月${d}日`;
}

}

function localDateString(date=new Date()){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function dateNumber(date){const [y,m,d]=date.split('-').map(Number);return Date.UTC(y,m-1,d)/86400000;}
function shiftedDate(date,offset){const [y,m,d]=date.split('-').map(Number);return localDateString(new Date(y,m-1,d+offset));}
function availableDay(){
  const elapsed=isValidDateStr(state.startDate) ? dateNumber(state.pausedOn||localDateString())-dateNumber(state.startDate)+1 : 1;
  return Math.max(0,Math.min(7,Math.max(elapsed,state.openThrough||0)));
}
function dayAvailable(n){return Number.isInteger(n)&&n>=1&&n<=availableDay();}
function dayOpeningMessage(n){

  if(!isValidDateStr(state.startDate))return '请家长设置开课日期后按日开放';
  return `${formatDateZh(shiftedDate(state.startDate,n-1))}开放`;
}
function replaceProgressSafely(candidate){

  if(!save()){state=previous;progressDirty=wasDirty;progressMessage('设置未保存，原进度保留。请检查存储权限后重试。');return false;}
  return true;
}
function setCourseDate(date,clear=false){
  if(!isValidDateStr(date))return false;
  const candidate=clear ? {days:cleanDays({}),games:{},assessments:{}} : JSON.parse(JSON.stringify(state));
  candidate.startDate=date;candidate.startDatePromptDismissed=true;
  delete candidate.pausedOn;delete candidate.openThrough;
  if(!replaceProgressSafely(candidate))return false;
  cleanGamesState();state.assessments=cleanAssessmentState(state.assessments);
  return true;
}
function changeSchedule(action){
  const candidate=JSON.parse(JSON.stringify(state)),today=localDateString();
  if(action==='pause'){
    if(candidate.pausedOn){
      if(candidate.startDate)candidate.startDate=shiftedDate(candidate.startDate,Math.max(0,dateNumber(today)-dateNumber(candidate.pausedOn)));
      delete candidate.pausedOn;
    }else{
      if(!candidate.startDate)candidate.startDate=today;
      candidate.pausedOn=today;
    }
  }else if(action==='advance'){
    if(!candidate.startDate)candidate.startDate=today;
    candidate.openThrough=Math.min(7,availableDay()+1);
  }
  return replaceProgressSafely(candidate);
}

    button.setAttribute('aria-disabled',String(locked));

/* ==================================================================
   state.games —— schema 整体建立 + 读取清洗（规格 §6.1/§6.2，S3 落地）。
   容器类字段只接受非 null、非数组的普通对象，否则整体重建默认（不动 state.days）；
   字段级按范围清洗，数组/对象整体替换不深合并，不做 schemaVersion。
   ================================================================== */
const FLASH_RECKEYS = ['flash_sounds', 'flash_words'];
const FLASH_METRIC_BY_KEY = { flash_sounds:'elapsed', flash_words:'count' };
const FLASH_CAPACITY_BY_KEY = META.flashCapacity;
const CONFIRM_SOURCES = ['g2', 'g4', 'g5'];
function isPlainObject(v){ return !!v && typeof v === 'object' && !Array.isArray(v); }
function cleanGamesState(){
  if(!isPlainObject(state.games)) state.games = {};
  const g = state.games;

  if(!isPlainObject(g.grab)) g.grab = {};
  // 轮次键从 G1_ROUNDS 派生，不再写死 ['s','a']——换周只改题库常量，清洗层自动跟上
  const grabKeys = Object.keys(G1_ROUNDS);
  grabKeys.forEach(k=>{
    if(!isPlainObject(g.grab[k])) g.grab[k] = {};
    const v = g.grab[k].best;
    g.grab[k].best = (typeof v === 'number' && Number.isInteger(v) && v >= 0 && v <= 8) ? v : 0;
  });
  Object.keys(g.grab).forEach(k=>{ if(!grabKeys.includes(k)) delete g.grab[k]; });   // S3 预筛 L1：未知键删除

  if(!isPlainObject(g.doors)) g.doors = {};
  { const v = g.doors.best; g.doors.best = (typeof v === 'number' && Number.isInteger(v) && v >= 0 && v <= 10) ? v : 0; }

  if(!isPlainObject(g.flash)) g.flash = {};
  Object.keys(g.flash).forEach(k=>{
    const rec = g.flash[k];
    const metric = FLASH_METRIC_BY_KEY[k];
    let bad = !FLASH_RECKEYS.includes(k) || !isPlainObject(rec) || rec.metric !== metric;
    if(!bad){
      if(metric === 'elapsed') bad = !(typeof rec.value === 'number' && Number.isFinite(rec.value) && rec.value > 0);
      else{
        const cap = FLASH_CAPACITY_BY_KEY[k] ?? Infinity;
        bad = !(typeof rec.value === 'number' && Number.isInteger(rec.value) && rec.value >= 0 && rec.value <= cap);
      }
    }
    if(bad) delete g.flash[k]; else g.flash[k] = {metric, value:rec.value};
  });

  if(!isPlainObject(g.confirms)) g.confirms = {};
  Object.keys(g.confirms).forEach(w=>{
    const rec = g.confirms[w];
    if(!Object.hasOwn(W, w) || Guard.isReserved(w) || !isPlainObject(rec)){ delete g.confirms[w]; return; }
    const cleaned = {};
    CONFIRM_SOURCES.forEach(src=>{ cleaned[src] = rec[src] === true; });
    g.confirms[w] = cleaned;
  });

  return g;
}
cleanGamesState();
state.assessments = cleanAssessmentState(state.assessments);

/* W4+ assessment UI: words appear only after explicit reveal, never have audio. */
function assessmentPool(kind){
  if(kind === 'exam') return RESERVED;
  if(kind === 'retest') return typeof RESERVED_RETEST === 'undefined' ? [] : RESERVED_RETEST;
  if(kind === 'probeA') return typeof PROBE_A === 'undefined' ? [] : PROBE_A;
  if(kind === 'probeB') return typeof PROBE_B === 'undefined' ? [] : PROBE_B;
  return [];
}
function cleanAssessmentState(raw){
  const clean = {};
  if(!isPlainObject(raw)) return clean;
  ['exam','retest','probeA','probeB','text'].forEach(kind=>{
    if(!isPlainObject(raw[kind])) return;
    const rec = raw[kind], item = {revealed:rec.revealed === true};
    if(kind === 'text'){
      const max = typeof ASSESS_TEXT === 'string' ? (ASSESS_TEXT.match(/[a-z]+/gi)||[]).length : 0;
      if(Number.isInteger(rec.errors) && rec.errors >= 0 && rec.errors <= max) item.errors = rec.errors;
      item.prompted = rec.prompted === true;
      item.understood = rec.understood === true;
    }else if(Number.isInteger(rec.score) && rec.score >= 0 && rec.score <= assessmentPool(kind).length) item.score = rec.score;
    clean[kind] = item;
  });
  return clean;
}
function escapeAssessment(value){
  return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function assessmentHTML(kind){
  const titles = {exam:'周检',retest:'复测',probeA:'段末探针首测',probeB:'段末探针复测',text:'月测阅读'};
  const rec = (state.assessments || {})[kind] || {};
  const pool = assessmentPool(kind);
  if(kind !== 'text' && !pool.length) return '';
  if(kind === 'text' && (typeof ASSESS_TEXT !== 'string' || !ASSESS_TEXT)) return '';
  if(!rec.revealed) return `<section data-assessment="${kind}" class="assessment"><p>准备好再打开${titles[kind]}。请让孩子独立读，先不示范、不点读。</p><button class="btn" data-assessment-reveal="${kind}">开始${titles[kind]}</button></section>`;
  let content;
  if(kind === 'text'){
    const count = ASSESS_TEXT.match(/[a-z]+/gi).length;
    content = `<p class="assessment-text en">${escapeAssessment(ASSESS_TEXT)}</p><p>全文 ${count} 词。3 秒内自我纠正不计错；家长给词计错；同一词每次出现分别计错。</p>
      <label>读错词数 <input type="number" min="0" max="${count}" step="1" data-assessment-errors value="${rec.errors ?? ''}"></label>
      <label><input type="checkbox" data-assessment-prompted ${rec.prompted?'checked':''}> 用过提示</label>
      <label><input type="checkbox" data-assessment-understood ${rec.understood?'checked':''}> 能说出一件主要事件</label><p data-assessment-result>${assessmentResult(rec,count)}</p>`;
  }else{
    content = `<div class="wcards">${pool.map(w=>`<div class="wcard"><div class="wcard__w">${escapeAssessment(w)}</div></div>`).join('')}</div>
      <label>读对几个 <select data-assessment-score><option value="">尚未记录</option>${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${rec.score===n?'selected':''}>${n} / 5</option>`).join('')}</select></label>`;
  }
  return `<section class="assessment" data-assessment="${kind}"><h3>${titles[kind]}</h3>${content}<p data-assessment-saved role="status"></p></section>`;
}
function assessmentResult(rec,count){
  if(!Number.isInteger(rec.errors)) return '记录错误数后显示阅读建议。';
  const rate = rec.errors / count;
  const advice = rate > .10 ? '降一级复习' : rate <= .05 && !rec.prompted ? '可考虑升级（还需符合字位覆盖）' : '留在本级巩固';
  return `错误率 ${(rate*100).toFixed(1)}%：${advice}。`;
}
function baselineSummary(){
  const first = state.assessments?.exam?.score, second = state.assessments?.retest?.score;
  if(!Number.isInteger(first) || !Number.isInteger(second)) return '第四周基线：完成周检与备用词两组，共 10 词。两组都记录后显示建议；计时快闪只记秒数，不设速度门槛。';
  const total = first + second;
  return `基线 ${total} / 10：${total >= 8 ? '达到进入第五周的解码门槛。' : '第四周再巩固一周；仍未达到 8 / 10，回第三周复习一周后重测。'} 月测阅读单独记录，不用速度代替准确度。`;
}
document.addEventListener('click', e=>{
  const button = e.target.closest('[data-assessment-reveal]'); if(!button) return;

document.addEventListener('change', e=>{

  document.querySelectorAll('[data-baseline-summary]').forEach(el=>el.textContent=baselineSummary());
});

/* Progress persistence. Inlined into every standalone lesson by tools/build_lessons.py. */
function cleanDays(raw){
  const days = {};
  DAYS.forEach((day, index)=>{
    const n = index + 1;
    const old = isPlainObject(raw) && isPlainObject(raw[n]) ? raw[n] : {};
    const checks = {};
    day.steps.forEach((step, si)=> step.blocks.filter(b=>b.b === 'checks').forEach(b=>{
      b.items.forEach((_, i)=>{
        const key = `${n}-${si}-${i}`;
        if(isPlainObject(old.checks) && old.checks[key] === true) checks[key] = true;
      });
    }));
    days[n] = {checks};
  });
  return days;
}
function loadProgress(){
  let value = {days:{}};
  try{
    const raw = localStorage.getItem(KEY);
    if(raw !== null){
      value = JSON.parse(raw);
      if(!isPlainObject(value)) throw new Error('invalid state');
      if(!isPlainObject(value.days) || Object.values(value.days).some(d=>!isPlainObject(d) || !isPlainObject(d.checks))){
        progressNotice = '部分进度格式异常，已恢复可读取的记录。建议导出一份备份。';
      }
    }
  }catch(e){
    value = {days:{}};
    progressNotice = '无法读取本周进度。原存储未被覆盖；请检查浏览器设置，或从备份恢复。';
  }
  value.days = cleanDays(value.days);
  return value;
}

function save(){

}

  let candidate = null, token = 0;
  row.querySelector('input').onchange = async e=>{
    const currentToken = ++token;
    candidate = null; confirm.hidden = true; status.textContent = '';

    try{
      if(file.size > 1024 * 1024) throw new Error('备份超过 1 MB。');

      status.textContent = `已读取本周备份，含 ${count} 项打卡。恢复会替换当前进度，建议先导出当前备份。`;
      confirm.hidden = false;
    }catch(err){ if(currentToken === token) status.textContent = err.message || '无法读取备份。'; }
  };
  confirm.onclick = ()=>{ if(candidate && !importProgress(candidate)) status.textContent = '恢复未完成，当前进度保留。请解决存储问题后再试。'; };
}

/* ==================================================================
   examRecorded —— G5 造词工坊的程序锁判定（规格 §2.5 入口1/5 + §3.1，U3
   落地）：语义定位"含 exam 块的 step 的 checks[0]"，不硬编码 '7-5-0' 字面——
   在 DAYS[day-1] 里找那个 blocks 含 {b:'exam'} 的 step，取它的 checks 列表
   第 0 项。第一周（唯一有 exam 块的周）该 step 正是 Day7 的"周检 · 5 分钟"
   （steps 下标 5），故此函数对 day=7 解析出的 key 恰好是 '7-5-0'，但这里
   不写死，换天/换周结构变化也不用改这个函数。没有 exam 块的天视为锁死
   （目前只有 Day7 会渲染 g5 块，这一分支实际不会被触发，但语义上更安全）。
   ================================================================== */
function examRecorded(day){
  const d = DAYS[day-1];
  if(!d) return false;
  const stepIdx = d.steps.findIndex(s => s.blocks.some(b => b.b === 'exam'));
  if(stepIdx === -1) return false;
  const key = day + '-' + stepIdx + '-0';
  return !!dayState(day).checks[key];
}
function dayDone(n){
  const d = DAYS[n-1]; const st = dayState(n);
  const total = d.steps.reduce((a,s)=> a + s.blocks.filter(b=>b.b==='checks').reduce((x,b)=>x+b.items.length,0), 0);
  if(!total) return !!st.done;
  const got = Object.values(st.checks).filter(Boolean).length;
  return got >= total;
}

function confettiHTML(){

    const hue = ['var(--ok)','var(--accent)','var(--cons)','var(--vowel)'][i % 4];

function dismissCelebration(){
  // E3：覆盖层非模态，"点击跳过"走 document 捕获阶段的一次性监听（见
  // showCelebration）——这里统一负责把那个监听也摘掉，不管是被它自己触发
  // 摘掉、还是被 2 秒定时器/切页(clearPageTimers)提前调用摘掉，都不留残留。
  if(activeCelebrationDismissClick){
    document.removeEventListener('click', activeCelebrationDismissClick, {capture:true});

function showCelebration(bodyHTML){

  el.innerHTML = bodyHTML;
  activeCelebration = el;
  document.body.appendChild(el);
  // E3：非模态——覆盖层本身 pointer-events:none 不拦截点击，"点击跳过"改用
  // document 捕获阶段一次性监听：点击先被这里看到（收层），再继续往下传播
  // 到真正的目标元素（比如 G1 气球），穿透和收层两不误。
  activeCelebrationDismissClick = () => dismissCelebration();

  if(Guard.isReserved(w)){ console.warn('[confirms] blocked reserved word:', w); return; }
  if(!isPlainObject(state.games.confirms[w])) state.games.confirms[w] = {};

}
function unconfirmWord(w, src){
  if(!CONFIRM_SOURCES.includes(src)){ console.warn('[confirms] unknown src:', src); return; }
  if(Guard.isReserved(w)){ console.warn('[confirms] blocked reserved word:', w); return; }
  if(!isPlainObject(state.games.confirms[w])) return;   // 没有既有条目就不创建垃圾条目
  state.games.confirms[w][src] = false;

}

        <thead><tr><th>读对几个</th><th>说明</th><th>下一步</th></tr></thead>

/* 切换视图会整块重绘 #app，此前挂在旧节点上的定时器必须一并停掉，
   否则闪卡计时器会在脱离文档的按钮上一直跑，反复进出还会叠加。 */
let pageTimers = [];
const laterOnce = (fn, ms) => { const id = setTimeout(fn, ms); pageTimers.push(id); return id; };
const everyTick = (fn, ms) => { const id = setInterval(fn, ms); pageTimers.push(id); return id; };
function clearPageTimers(){
  cancelActiveLongPresses();
  pageTimers.forEach(id=>{ clearTimeout(id); clearInterval(id); });
  pageTimers = [];
  AudioBus.stopAll();   // 切页清理：stopAll 合法调用方②（内含 hideAudioFailure）
  dismissCelebration();   // 切页也收掉挂在 body 上的庆祝覆盖层，防止残留到新页面
  // 审 20 复审 R-5：整页重绘（renderHome / renderDay / renderWall 都先经过这里）前显式收掉
  // 家长面板里的重置长按，不只靠 pageTimers 的隐式清理
  const pp = document.querySelector('[data-parent-panel]');
  if(pp && pp._resetCancel){ pp._resetCancel(); pp._resetCancel = null; }
}

function taughtWords(){
  const words = [];
  DAYS.forEach(d => {
    if(d.rest) return;
    d.steps.forEach(s => s.blocks.forEach(b => {
      if(b.b === 'words') b.items.forEach(w => { if(!words.includes(w)) words.push(w); });
    }));
  });
  return words;
}

      <h1>本周词卡墙</h1>
      <p class="lead" style="margin-top:10px">点卡片听单词。一共 ${words.length} 个，和每天课里拼过的是同一批。<span class="en">at</span>、<span class="en">in</span>、<span class="en">an</span> 听完单词后会再听词组。</p>
      <p class="lead" style="margin-top:6px">读出来的词会点亮——已点亮 <b>${litCount} / ${words.length}</b></p>
    </div>
    <div class="wcards wcards--wall">
      ${words.map(w => {
        const d = W[w] || {zh:'',art:null};
        const hint = WALL_HINT[w];
        const lit = trophies.has(w);
        return `<button class="wcard wcard--wall ${lit?'':'wcard--trophy-off'}" data-say="${w}"${hint && hint.say ? ` data-phrase="${hint.en}"` : ''}>
          <div class="wcard__art wcard__art--lg">${d.art?illHTML(d.art,112):`<div style="font-family:var(--en);font-size:36px;font-weight:700">${colorWord(w)}</div>`}</div>
          <div class="wcard__w">${colorWord(w)}</div>
          ${hint
            ? `<div class="wall-hint"><span class="wall-hint__en">${hint.en}</span><span class="wall-hint__zh">${hint.zh}</span></div>`
            : `<div class="wcard__zh">${d.zh}</div>`}
        </button>`;
      }).join('')}
    </div>
    <div style="height:48px"></div>
  </div>`;
  renderDots(0);
  window.scrollTo(0,0);
}

function renderDay(n){
  if(!dayAvailable(n)){curDay=0;renderHome();return;}
  clearPageTimers();
  const d = DAYS[n-1];
  const ctx = {day:n, uid:0, stepIdx:0};
  const stepsHTML = d.steps.map((s,i)=>{
    ctx.stepIdx = i;
    const body = s.blocks.map(b=>blockHTML(b,ctx)).join('');
    // 标题里的音标一律取自 SOUNDS，避免手写的 /a/ 与真实音标 /æ/ 不一致
    const sb = s.blocks.find(b=>b.b==='sound');
    const ttl = sb ? s.t.replace(/\/[^/\s]*\//, SOUNDS[sb.s].ipa) : s.t;
    return `<section class="step" data-step="${i}">
      <button class="step__hd" data-toggle="${i}">
        <span class="step__num">${i+1}</span>
        <span class="step__ttl">${ttl}</span>
        ${s.min?`<span class="step__min">${s.min} 分钟</span>`:''}
      </button>
      <div class="step__body" hidden>${body}</div>
    </section>`;
  }).join('');

  const total = d.steps.reduce((a,s)=>a+s.min,0);
  document.getElementById('app').innerHTML = `
  <div class="wrap">
    <div class="dayhead">
      <button class="backlink" data-goto="0">${ART.arrowL} 返回本周总览</button>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="pill pill--c">${d.wd}</span>
        ${d.sounds.length?`<span class="pill">今日音 ${d.sounds.map(s=>SOUNDS[s].ipa).join(' ')}</span>`:''}
        <span class="pill ${d.rest?'pill--a':''}">${d.rest?'休息日':'共 '+total+' 分钟'}</span>
      </div>
      <h1>${d.title}</h1>
      <div class="goalbar">
        <span class="goalbar__l">今日目标</span>
        <span class="goalbar__t">${d.goal}</span>
      </div>
    </div>
    <div class="steps">${stepsHTML}</div>
    <div class="finish" id="finish"></div>
    <div style="display:flex;gap:12px;justify-content:space-between;margin-bottom:56px">
      ${n>1?`<button class="btn btn--ghost" data-goto="${n-1}">${ART.arrowL} 第 ${n-1} 天</button>`:'<span></span>'}
      ${n<7?`<button class="btn btn--ghost" data-goto="${n+1}">第 ${n+1} 天 ${ART.arrowR}</button>`:'<span></span>'}
    </div>
  </div>`;

  renderDots(n);
  initG2(); initG3(); initG4(); initG5(); initFlash(); initBook(); initG1(); initInitialPick();
  updateFinish(n);
  // 展开第一个未完成的步骤
  const firstOpen = document.querySelector('.step');
  if(firstOpen) toggleStep(firstOpen.dataset.step, true);
  window.scrollTo(0,0);
}

function toggleStep(i, force){
  const el = document.querySelector(`.step[data-step="${i}"]`);
  if(!el) return;
  const body = el.querySelector('.step__body');
  const open = force != null ? force : body.hidden;
  if(!open){
    // S3 预筛 M2 + 合并审 C1 + T1 预筛 D8 + U1/U2：折叠时清理该 step 子树内
    // G1/G2/G3/G4 卡的挂起计时器/陈旧回调，否则计时器会在隐藏节点上继续跑，
    // 重新展开时弹出一个"过期"的反馈。子树里只要含这四种卡任一种，就
    // AudioBus.stopAll()（停音频+清顶部失败提示条的 continuation）；
    // _g1Reset()/_g3Reset()/_g4Reset() 是各自的 UI 复位钩子（"组件级 reset
    // 钩子"默认模式延续到 G3/G4）；_g2Cancel()（E2）是 bindLongPress 返回的
    // 取消函数。不含这四种卡的普通 step 折叠不掐别处正在播的音频。
    const initialPicks = body.querySelectorAll('[data-initialpick]');
    const g1s = body.querySelectorAll('[data-g1-round]');
    const g2s = body.querySelectorAll('[data-g2]');
    const g3s = body.querySelectorAll('[data-g3-pair]');
    const g4s = body.querySelectorAll('[data-g4]');
    if(initialPicks.length || g1s.length || g2s.length || g3s.length || g4s.length){
      AudioBus.stopAll();
      initialPicks.forEach(game=>{ if(game._initialPickReset) game._initialPickReset(); });
      g1s.forEach(g1=>{ if(g1._g1Reset) g1._g1Reset(); });
      g2s.forEach(g2=>{ if(g2._g2Cancel) g2._g2Cancel(); });
      g3s.forEach(g3=>{ if(g3._g3Reset) g3._g3Reset(); });
      g4s.forEach(g4=>{ if(g4._g4Reset) g4._g4Reset(); });
    }
    // E1（合并审 high）：G6 闪卡计时器不经过 AudioBus（不放音频，纯本地
    // setInterval/setTimeout），独立清理，不复用上面那条"仅当有G1/G2才停
    // 音频"的分支（会误停同页其它正在播的音频组件）。_flashReset() 只终止
    // 计时、不结算不写成绩。
    body.querySelectorAll('[data-reckey]').forEach(fl=>{ if(fl._flashReset) fl._flashReset(); });
    // U3：G5 造词工坊全程不放音频（规格 §4.5 明确要求），12 分钟软提示计时器
    // 也是纯本地 setTimeout，跟 G6 闪卡同理独立清理，不进上面的 AudioBus 分支。
    // _g5Reset() 清计时+收起可能已出现的打哈欠角标，不结算不动 confirms。
    body.querySelectorAll('[data-g5]').forEach(g5=>{ if(g5._g5Reset) g5._g5Reset(); });
  } else {
    // F3（P2 末审）：展开是 G5"从这一刻起 12 分钟"计时的唯一起点——折叠
    // 期间、以及页面刚渲染出来但还没被点开过，都不算数。_g5Resume() 会先
    // 按 examRecorded 重渲染一次（锁状态可能在折叠期间已经变了），确认
    // 解锁才补计时；其余游戏没有这类"进入计时"语义，不需要对称的展开钩子。
    body.querySelectorAll('[data-g5]').forEach(g5=>{ if(g5._g5Resume) g5._g5Resume(); });
  }
  body.hidden = !open;
  el.classList.toggle('step--open', open);
}

function updateFinish(n){
  const el = document.getElementById('finish');
  if(!el) return;
  const d = DAYS[n-1];
  const total = d.steps.reduce((a,s)=>a+s.blocks.filter(b=>b.b==='checks').reduce((x,b)=>x+b.items.length,0),0);
  const got = Object.values(dayState(n).checks).filter(Boolean).length;
  if(!total){
    el.className = 'finish';
    el.innerHTML = `<h3>今天好好玩</h3><p>休息日不打卡。做完周检，这一周就完整了。</p>
      ${n<7?'':`<button class="btn btn--ghost" data-goto="0">回到总览</button>`}`;
    return;
  }
  const done = got >= total;
  el.className = 'finish' + (done?' finish--on':'');
  el.innerHTML = done
    ? `<span style="color:var(--ok)">${ART.star}</span>
       <h3>第 ${n} 天完成</h3>
       <p>${n<6?'明天见。今天的成果别忘了口头夸一句具体的——「你今天自己拼出了 5 个词」比「你真棒」有用得多。':'这一周走完了。第七天玩一天，然后做周检。'}</p>
       ${n<7?`<button class="btn btn--ok" data-goto="${n+1}">去第 ${n+1} 天 ${ART.arrowR}</button>`:''}`
    : `<h3>还差 ${total-got} 项</h3>
       <p>打卡清单在最后一步。<b>如果有一项没做到，不要勾</b>——这张表是给你自己看的尺子，勾满了才有意义。</p>`;
}
